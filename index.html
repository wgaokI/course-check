<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>あなたに合う通学スタイル診断｜わせがくＰＵＲＥ高等学校 早稲田キャンパス</title>

  <meta
    name="description"
    content="わせがくＰＵＲＥ高等学校 早稲田キャンパスの通学スタイル診断です。質問に答えて、自分に合いそうな通学スタイルを見つけてみましょう。"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="background-decoration decoration-one"></div>
  <div class="background-decoration decoration-two"></div>
  <div class="background-decoration decoration-three"></div>

  <main class="site-container">

    <section id="start-screen" class="screen active">

      <div class="school-name">
        <span>わせがくＰＵＲＥ高等学校</span>
        <strong>早稲田キャンパス</strong>
      </div>

      <div class="diagnosis-card">

        <div class="small-label">
          COURSE STYLE CHECK
        </div>

        <div class="main-icon" aria-hidden="true">
          <span>✓</span>
        </div>

        <h1>
          あなたに合う<br>
          <span>通学スタイル診断</span>
        </h1>

        <p class="lead-text">
          高校生活で大切にしたいことや、今の生活スタイルについて答えると、
          自分に合いそうな通学スタイルが分かります。
        </p>

        <div class="diagnosis-info">
          <div class="info-item">
            <span class="info-icon">Q</span>
            <div>
              <small>質問数</small>
              <strong>全10問</strong>
            </div>
          </div>

          <div class="info-line"></div>

          <div class="info-item">
            <span class="info-icon">⌛</span>
            <div>
              <small>所要時間</small>
              <strong>約2分</strong>
            </div>
          </div>
        </div>

        <button id="start-button" class="primary-button" type="button">
          <span>診断をはじめる</span>
          <span class="button-arrow">→</span>
        </button>

        <p class="notice">
          診断結果は、通学スタイルを考える際の参考としてご覧ください。
        </p>

      </div>

      <div class="style-preview" aria-label="診断対象となる通学スタイル">
        <span>5日スタイル</span>
        <span>3日スタイル</span>
        <span>WEBスタイル</span>
      </div>

    </section>

    <section id="preparation-screen" class="screen">

      <div class="diagnosis-card compact-card">

        <div class="main-icon small-icon" aria-hidden="true">
          <span>!</span>
        </div>

        <p class="section-label">
          診断ページ準備中
        </p>

        <h2>
          トップページが<br>
          完成しました！
        </h2>

        <p class="lead-text">
          次に、10問の質問画面と診断結果を追加していきます。
        </p>

        <button id="back-button" class="secondary-button" type="button">
          トップに戻る
        </button>

      </div>

    </section>

  </main>

  <footer>
    <p>
      わせがくＰＵＲＥ高等学校 早稲田キャンパス
    </p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
